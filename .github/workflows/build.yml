name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create . --platforms=android,web --project-name memory_jar --org com.rashidraihan
      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Memory Jar"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Make and apply icon
        run: |
          pip install pillow
          python scripts/make_icon.py
          dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi
      - run: flutter build web --release --base-href "/memory-jar/"
      - uses: actions/upload-artifact@v4
        with:
          name: memory-jar-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk